<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== COCKPIT HUD ===== -->
  <div id="cockpit">

    <!-- HUD Top-Left: Logo + Status -->
    <div class="hud hud-tl" data-anim="1">
      <div class="hud-corner tl"></div>
      <h1 class="hud-title">SOLAR SYSTEM<br><span>EXPLORER</span></h1>
      <div class="hud-status">
        <span class="status-dot"></span>
        <span class="status-text">TELEMETRIE ACTIVE</span>
      </div>
    </div>

    <!-- HUD Top-Right: Telemetry -->
    <div class="hud hud-tr" data-anim="2">
      <div class="hud-corner tr"></div>
      <div id="hud-telemetry">
        <div class="telem-row"><span class="telem-label">DATE</span><span class="telem-value" id="telem-date">--</span></div>
        <div class="telem-row"><span class="telem-label">UTC</span><span class="telem-value" id="telem-utc">--:--:--</span></div>
        <div class="telem-row"><span class="telem-label">SRC</span><span class="telem-value">NASA / ESA</span></div>
      </div>
    </div>

    <!-- HUD Bottom-Left: System Stats -->
    <div class="hud hud-bl" data-anim="3">
      <div class="hud-corner bl"></div>
      <div id="hud-stats">
        <div class="stat-item"><span class="stat-value" id="stat-planets">8</span><span class="stat-label">PLANETES</span></div>
        <div class="stat-item"><span class="stat-value" id="stat-moons">0</span><span class="stat-label">LUNES</span></div>
        <div class="stat-item"><span class="stat-value" id="stat-missions">0</span><span class="stat-label">MISSIONS</span></div>
      </div>
    </div>

    <!-- HUD Bottom-Right: Theme Toggle + Burger Menu -->
    <div class="hud hud-br" data-anim="4">
      <button id="theme-toggle" aria-label="Theme">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="burger-btn" aria-label="Menu">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
      <div id="burger-menu" class="burger-closed">
        <div class="burger-header">NAVIGATION</div>
        <nav id="planet-nav"></nav>
      </div>
    </div>

    <!-- Central: Solar System View -->
    <section id="solar-system-view">
      <div id="sun-container" class="celestial-body" data-body="soleil">
        <div class="body-sphere sun-sphere"></div>
        <span class="body-label">Soleil</span>
      </div>
      <div id="orbits-container"></div>
    </section>

    <!-- Crosshair center -->
    <div class="hud-crosshair"></div>
  </div>

  <!-- ===== DETAIL PANEL ===== -->
  <section id="detail-panel" class="hidden">
    <div id="terrain-bg"></div>
    <div id="detail-overlay"></div>
    <button id="close-detail" aria-label="Fermer">&times;</button>
    <div id="detail-header">
      <div id="detail-sphere-container"></div>
      <div id="detail-title-block">
        <h2 id="detail-name"></h2>
        <p id="detail-type"></p>
      </div>
    </div>
    <div id="detail-tabs"></div>
    <div id="detail-content"></div>
    <div id="detail-sources">
      <h4>Sources</h4>
      <ul id="source-links"></ul>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
